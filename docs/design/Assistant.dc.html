<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#241B45">
  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="55" fill="#CFB0F4"></circle>
    <circle cx="100" cy="100" r="55" fill="none" stroke="#F4FAFF" stroke-width="3" opacity="0.6"></circle>
  </svg>
</template>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#3A3060,#241B45);font-family:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box}
.vd-scroll::-webkit-scrollbar{width:0;height:0}
.vd-scroll{scrollbar-width:none;-ms-overflow-style:none}
@keyframes vd-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes vd-ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.55);opacity:0}}
@keyframes vd-bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes vd-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes vd-spin-r{from{transform:rotate(360deg)}to{transform:rotate(0)}}
@keyframes vd-drift{0%,100%{transform:translate(-8%,-6%) scale(1)}50%{transform:translate(8%,6%) scale(1.15)}}
@keyframes vd-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes vd-listen{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@keyframes vd-think{0%,100%{transform:scale(.97) rotate(-1deg)}50%{transform:scale(1.01) rotate(1deg)}}
@keyframes vd-speak{0%,100%{transform:scale(1.02)}25%{transform:scale(1.06)}50%{transform:scale(1.0)}75%{transform:scale(1.07)}}
</style>
</helmet>

<!-- Embedded in the Patient app: bare screen (the app supplies the iPhone frame) -->
<sc-if value="{{ embedded }}" hint-placeholder-val="{{ false }}">
<div data-om-label="ConsultScreen" data-screen-label="Patient · Consult" style="position: relative; height: 100%; width: 100%; box-sizing: border-box; margin: 0 auto; display: flex; flex-direction: column; padding: clamp(16px,4%,40px) clamp(14px,5%,22px) clamp(16px,4%,26px); overflow: hidden">

  <div style="flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(7px,2vh,14px); padding: clamp(4px,1.5vh,14px) 0 6px">
    <div style="position:relative;width:clamp(84px,24%,152px);aspect-ratio:152/162;display:flex;align-items:flex-start;justify-content:center;flex:none">
      <div style="position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:116px;height:20px;border-radius:50%;background:radial-gradient(ellipse,rgba(90,70,170,.4),transparent 70%);filter:blur(4px)"></div>
      <div style="{{ ringColorA }}"></div>
      <div style="{{ ringColorB }}"></div>
      <div onClick="{{ orbTap }}" style="{{ orbAnimStyle }}">
        <div style="position:absolute;inset:-20%;animation:vd-spin 9s linear infinite"><div style="position:absolute;top:5%;left:12%;width:70%;height:70%;border-radius:50%;background:oklch(0.70 0.19 232);filter:blur(16px)"></div><div style="position:absolute;bottom:2%;right:8%;width:65%;height:65%;border-radius:50%;background:oklch(0.68 0.21 335);filter:blur(18px)"></div></div>
        <div style="position:absolute;inset:-20%;animation:vd-spin-r 13s linear infinite"><div style="position:absolute;top:30%;right:5%;width:60%;height:60%;border-radius:50%;background:oklch(0.77 0.19 188);filter:blur(14px)"></div><div style="position:absolute;bottom:15%;left:5%;width:50%;height:50%;border-radius:50%;background:oklch(0.72 0.21 8);filter:blur(16px);animation:vd-drift 7s ease-in-out infinite"></div></div>
        <div style="position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 -16px 26px oklch(0.4 0.13 275 / .4),inset 0 10px 16px rgba(255,255,255,.5)"></div>
        <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 33% 22%,rgba(255,255,255,.9),rgba(255,255,255,0) 42%)"></div>
      </div>
    </div>
    <div style="font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6B6790">Dr. Mira</div>
  </div>

  <div data-om-label="NotesAndSuggestions" style="flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; height: 100%">
  <sc-if value="{{ hasNotes }}" hint-placeholder-val="{{ false }}">
    <div data-om-label="ReviewNotesPanel" style="flex: 1; min-height: 200px; display: flex; flex-direction: column; background: #F8F6FC; backdrop-filter: blur(14px) saturate(160%); border-radius: 14px; padding: 6px 14px 10px; margin-top: 10px; box-shadow: none; width: 100%">
      <div data-om-label="NotesToggleHandle" onClick="{{ toggleNotes }}" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:2px 0 8px;margin-bottom:2px">
        <div style="width:36px;height:4px;border-radius:14px;background:rgba(90,70,180,.28)"></div>
        <div style="display:flex;align-items:center;gap:6px"><span style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap;color:#6B6790">{{ notesTitle }}</span></div>
      </div>
      <div class="vd-scroll" style="{{ notesBodyStyle }}">
        <sc-for list="{{ notes }}" as="n" hint-placeholder-count="2">
          <div style="display:flex;justify-content:{{ n.align }};animation:vd-fade .3s ease both"><div style="{{ n.bubbleStyle }}"><div>{{ n.t }}</div><div style="{{ n.footerStyle }}">{{ n.footerText }}</div></div></div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ showChips }}" hint-placeholder-val="{{ true }}">
    <div data-om-label="SuggestionChipsRow" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-start;margin-top:10px;padding:0">
      <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4">
        <div onClick="{{ c.onClick }}" style="cursor: pointer; flex: none; white-space: nowrap; padding: 9px 14px; border: 1px solid oklch(0.85 0.04 300); border-radius: 16px 16px 4px 16px; font-size: 10px; font-weight: 400; color: #3A2E5C; box-shadow: 0 2px 8px oklch(0.6 0.1 290 / .16); background-color: #CFB0F4">{{ c.label }}</div>
      </sc-for>
    </div>
  </sc-if>

  <div style="margin-top:10px">
    <sc-if value="{{ photoAttached }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;background:#EFEBFB;border-radius:12px;font-size:13px;font-weight:600;color:#fff">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="3" stroke="#fff" stroke-width="1.7"></rect><circle cx="9" cy="11" r="2" stroke="#fff" stroke-width="1.7"></circle><path d="M4 18l5-4 4 3 3-2 4 3" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg>Photo attached · {{ photoName }}
      </div>
    </sc-if>
    <div data-om-label="MessageInputRow" style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.9);border-radius:999px;padding:4px 4px 4px 6px;box-shadow:none">
      <div data-om-label="AttachButton" onClick="{{ attachPhoto }}" title="Attach photo" style="cursor:pointer;width:36px;height:36px;border-radius:50%;background:#F0ECFB;display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#6B6790" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M8 7l4-4 4 4"></path><path d="M5 12v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
      </div>
      <input value="{{ input }}" onInput="{{ onInput }}" onKeyDown="{{ onKey }}" placeholder="{{ inputPlaceholder }}" style="flex: 1; border: none; outline: none; background: transparent; font-family: inherit; font-size: 12px; color: #241B45; padding: 10px 6px">
      <div onClick="{{ send }}" style="cursor:pointer;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,oklch(0.69 0.15 287),oklch(0.54 0.19 290));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px oklch(0.45 0.2 290 / .5)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12h13M12 5l7 7-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </div>
  </div>

  <div data-om-label="CallControlsWrapper" style="display: flex; justify-content: center; flex: none; padding-top: 10px; padding-bottom: 10px">
    <div data-om-label="CallControlsBar" style="display:flex;align-items:center;gap:14px;height:66px;padding:0 18px;border-radius:34px;background:linear-gradient(180deg, oklch(0.93 0.045 300 / .58), oklch(0.9 0.05 298 / .42));backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border:1px solid oklch(0.97 0.02 300 / .75);box-shadow:0 14px 34px oklch(0.45 0.12 295 / .3), 0 2px 8px rgba(46,37,71,.14), inset 0 1px 1px rgba(255,255,255,.6)">
      <div data-om-label="MuteButton" onClick="{{ toggleMute }}" title="{{ micLabel }}" style="width:46px;height:46px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:{{ muteButtonBg }}">
        <sc-if value="{{ notMuted }}" hint-placeholder-val="{{ true }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ muteIconColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="{{ muteIconColor }}" stroke="none"></rect><path d="M5 11v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
        </sc-if>
        <sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ muteIconColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="{{ muteIconColor }}" stroke="none"></rect><path d="M5 11v1a7 7 0 0 0 14 0v-1"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="4" y1="3" x2="20" y2="21"></line></svg>
        </sc-if>
      </div>
      <div data-om-label="VideoToggleButton" onClick="{{ toggleVideo }}" title="{{ videoLabel }}" style="width:46px;height:46px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:{{ videoButtonBg }}">
        <sc-if value="{{ videoOn }}" hint-placeholder-val="{{ true }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ videoIconColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6.5" width="13" height="11" rx="2.5" fill="{{ videoIconColor }}" stroke="none"></rect><path d="M15.5 10.2l6-3.4v10.4l-6-3.4z" fill="{{ videoIconColor }}"></path></svg>
        </sc-if>
        <sc-if value="{{ videoOff }}" hint-placeholder-val="{{ false }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ videoIconColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5h9a2 2 0 0 1 2 2v.8"></path><path d="M13.5 17.5h-9a2 2 0 0 1-2-2v-6"></path><path d="M15.5 10.2l6-3.4v10.4l-6-3.4z"></path><line x1="3" y1="3" x2="21" y2="21"></line></svg>
        </sc-if>
      </div>
      <div data-om-label="AudioRouteButton" onClick="{{ cycleAudioRoute }}" title="{{ audioRouteLabel }}" style="width:46px;height:46px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;background:{{ volButtonBg }}">
        <sc-if value="{{ routeIsSpeaker }}" hint-placeholder-val="{{ true }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{ volIconColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L13 19V5L7.5 9.5z" fill="{{ volIconColor }}"></path><path d="M16.5 8.5a4.5 4.5 0 0 1 0 7"></path><path d="M19 6a8 8 0 0 1 0 12"></path></svg>
        </sc-if>
        <sc-if value="{{ routeIsEarpiece }}" hint-placeholder-val="{{ false }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{ volIconColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"></rect><line x1="10" y1="18.5" x2="14" y2="18.5"></line></svg>
        </sc-if>
        <sc-if value="{{ routeIsBluetooth }}" hint-placeholder-val="{{ false }}">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{ volIconColor }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7.5 17 16l-5 4V4l5 4L7 16.5"></path></svg>
        </sc-if>
      </div>
      <div data-om-label="EndCallButton" onClick="{{ endVisit }}" title="End call" style="width:50px;height:50px;border-radius:50%;cursor:pointer;background:linear-gradient(135deg,oklch(0.68 0.17 12),oklch(0.55 0.2 8));box-shadow:0 6px 16px oklch(0.5 0.2 12 / .5);display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" style="transform:rotate(135deg)"><path d="M6.6 3.4c.5-.1 1 .2 1.2.7l1.1 2.6c.2.5.1 1-.3 1.4L7.3 9.4a12.5 12.5 0 0 0 5.3 5.3l1.3-1.3c.4-.4.9-.5 1.4-.3l2.6 1.1c.5.2.8.7.7 1.2l-.5 2.6c-.1.6-.6 1-1.2 1A15.2 15.2 0 0 1 3 6.7c0-.6.4-1.1 1-1.2z" fill="#fff"></path></svg>
      </div>
    </div>
  </div>
</div>

      'backdrop-filter:blur(22px) saturate(180%)', '-webkit-backdrop-filter:blur(22px) saturate(180%)',
      'border:1px solid oklch(0.97 0.02 300 / .75)',
      'box-shadow:0 14px 34px oklch(0.45 0.12 295 / .3), 0 2px 8px rgba(46,37,71,.14), inset 0 1px 1px rgba(255,255,255,.6)',
      '-webkit-mask:radial-gradient(circle 38px at 50% 7px, transparent 37px, #000 37.5px)',
      'mask:radial-gradient(circle 38px at 50% 7px, transparent 37px, #000 37.5px)',
    ].join(';');

    return {
      embedded, notEmbedded: !embedded,
      input: s.input,
      onInput: (e) => this.setState({ input: e.target.value }),
      onKey: (e) => { if (e.key === 'Enter') this.send(); },
      send: () => this.send(),
      endVisit: () => this.endVisit(),
      currentLine: s.currentLine,
      statusLabel: consultStatus,
      orbTap: () => this.orbTap(),
      orbAnimStyle: 'position:relative;width:86%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#F4FAFF;box-shadow:0 24px 48px oklch(0.35 0.15 270 / .55),0 0 42px rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.85);cursor:pointer;animation:' + orbAnim,
      ringColorA: `position:absolute;inset:0 7px 24px 7px;border-radius:50%;border:1.5px solid ${ringColor};animation:vd-ring 2.8s ease-out infinite`,
      ringColorB: `position:absolute;inset:0 7px 24px 7px;border-radius:50%;border:1.5px solid ${ringColor};opacity:.6;animation:vd-ring 2.8s ease-out 1s infinite`,
      waveBars, waveLive,
      attachPhoto: () => this.attachPhoto(),
      photoAttached: s.photoAttached, photoName: s.photoName,
      hasNotes: notes.length > 0,
      notes,
      notesExpanded: s.notesExpanded,
      toggleNotes: () => this.setState(st => ({ notesExpanded: !st.notesExpanded })),
      notesToggleLabel: s.notesExpanded ? '▾ tap to collapse' : '▴ tap to expand',
      notesBodyStyle: `flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;padding-bottom:2px;transition:max-height .25s ease;max-height:${s.notesExpanded ? '9999px' : '130px'}`,
      showType: s.showType,
      toggleMute: () => this.toggleMute(),
      micLabel: s.muted ? 'Unmute' : 'Mute',
      muted: s.muted, notMuted: !s.muted,
      routeIsSpeaker: s.audioRoute === 'speaker',
      routeIsEarpiece: s.audioRoute === 'earpiece',
      routeIsBluetooth: s.audioRoute === 'bluetooth',
      audioRouteLabel: s.audioRoute === 'speaker' ? 'Speaker' : (s.audioRoute === 'earpiece' ? 'Earpiece' : 'Bluetooth'),
      cycleAudioRoute: () => this.setState(st => ({ audioRoute: st.audioRoute === 'speaker' ? 'earpiece' : (st.audioRoute === 'earpiece' ? 'bluetooth' : 'speaker') })),
      ccUploadColor: '#8480A5', ccCameraColor: '#8480A5',
      ccVolColor: 'oklch(0.56 0.19 290)',
      ccVolDotBg: 'oklch(0.56 0.19 290)',
      ccVolDotShadow: '0 0 8px oklch(0.56 0.19 290)',
      ccMuteColor: s.muted ? '#8480A5' : 'oklch(0.56 0.19 290)',
      ccMuteDotBg: s.muted ? 'transparent' : 'oklch(0.56 0.19 290)',
      ccMuteDotShadow: s.muted ? 'none' : '0 0 8px oklch(0.56 0.19 290)',
      muteButtonBg: s.muted ? 'oklch(0.62 0.21 20 / .16)' : '#F0ECFB',
      muteIconColor: s.muted ? 'oklch(0.55 0.19 20)' : '#3D3568',
      videoOn: s.videoOn, videoOff: !s.videoOn,
      toggleVideo: () => this.toggleVideo(),
      videoButtonBg: s.videoOn ? '#F0ECFB' : 'oklch(0.62 0.21 20 / .16)',
      videoIconColor: s.videoOn ? '#3D3568' : 'oklch(0.55 0.19 20)',
      videoLabel: s.videoOn ? 'Turn camera off' : 'Turn camera on',
      volButtonBg: '#F0ECFB', volIconColor: '#3D3568',
      navBarStyle: barStyle,
      showChips: isReview ? !s.thinking : (s.messages.length <= 1 && !s.thinking),
      chips: isReview
        ? [ { label: 'Change Rx', fill: 'Change the prescription — ' }, { label: 'Change lab test', fill: 'Change the lab test — ' }, { label: 'Update advice', fill: 'Update the advice — ' } ].map(c => ({ label: c.label, onClick: () => this.setState({ input: c.fill }) }))
        : ['I have a fever', 'Bad headache', 'Stomach pain'].map(l => ({ label: l, onClick: () => this.fillChip(l) })),
      inputPlaceholder: isReview ? 'Reply to Dr. Mira…' : 'Type or describe it your way…',
      notesTitle: isReview ? 'Review thread' : 'Consult notes',
      isReview, notReview,
    };
  }
}
</script>
</body>
</html>
