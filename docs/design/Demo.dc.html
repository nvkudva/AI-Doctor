<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box}
</style>
</helmet>

<div data-om-label="DemoRoot" style="position:relative;min-height:100vh;background:linear-gradient(180deg,#cccccc,#28211a)">

  <div data-om-label="ToggleBar" style="display:flex;align-items:center;justify-content:center;padding:16px 5px;position:relative;z-index:100">
    <div style="display:flex;align-items:center;gap:4px;padding:5px;border-radius:30px;background:rgba(255,255,255,.9);backdrop-filter:blur(14px) saturate(160%);box-shadow:0 10px 30px rgba(30,20,60,.35);border:1px solid rgba(255,255,255,.6)">
      <div onClick="{{ showPatient }}" style="{{ patientTabStyle }}">Patient app</div>
      <div onClick="{{ showDoctor }}" style="{{ doctorTabStyle }}">Doctor app</div>
    </div>
  </div>

  <sc-if value="{{ isPatient }}" hint-placeholder-val="{{ true }}">
    <dc-import name="Patient" hint-size="100%,100vh" style="display:block;width:100%;min-height:100vh"></dc-import>
  </sc-if>
  <sc-if value="{{ isDoctor }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Doctor" hint-size="100%,100vh" style="display:block;width:100%;min-height:100vh"></dc-import>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { active: 'patient' };

  renderVals() {
    const active = this.state.active;
    const tabBase = 'cursor:pointer;padding:10px 22px;border-radius:24px;font-size:14px;font-weight:700;transition:background .15s,color .15s';
    const activeStyle = tabBase + ';background:linear-gradient(158deg,oklch(0.72 0.12 300),oklch(0.58 0.17 292));color:#fff;box-shadow:0 6px 16px oklch(0.55 0.19 295 / .45)';
    const inactiveStyle = tabBase + ';background:transparent;color:#3D3568';
    return {
      isPatient: active === 'patient',
      isDoctor: active === 'doctor',
      patientTabStyle: active === 'patient' ? activeStyle : inactiveStyle,
      doctorTabStyle: active === 'doctor' ? activeStyle : inactiveStyle,
      showPatient: () => this.setState({ active: 'patient' }),
      showDoctor: () => this.setState({ active: 'doctor' }),
    };
  }
}

</script>
</body>
</html>
