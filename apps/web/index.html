<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- One meta, not a media-query pair: the theme is a stored choice that can
     disagree with the OS, and the pre-paint script below owns the answer. -->
<meta name="theme-color" id="vd-theme-color" content="#CDB6EC">
<title>AI Doctor</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<!-- iOS ignores the manifest's icons and display mode entirely; without these
     an Add to Home Screen gets a page screenshot inside a Safari frame. -->
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI Doctor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>try{var t=localStorage.getItem('vd_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;document.getElementById('vd-theme-color').content=t==='dark'?'#241B45':'#CDB6EC'}catch(e){}</script>
<!-- Pre-paint ground only; the font stack, box-sizing and .vd-scroll live in lib/theme/theme.css. -->
<style>
body{margin:0;background:#CDB6EC;min-height:100vh}
[data-theme="dark"] body{background:#241B45}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
