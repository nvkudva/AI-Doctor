<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AI Doctor">
  <title>AI Doctor</title>
  <defs>
    <!-- The sphere is Dr. Mira's own orb (lib/ui/Mira.module.css): the body
         gradient is offset low so the light reads as coming from above left,
         with the cyan and warm accents the presence ring uses. -->
    <radialGradient id="body" cx="50%" cy="56%" r="72%">
      <stop offset="0%"   stop-color="#35a9ff"/>
      <stop offset="62%"  stop-color="#4777f0"/>
      <stop offset="100%" stop-color="#3554c8"/>
    </radialGradient>
    <radialGradient id="spec" cx="34%" cy="26%" r="46%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="74%" cy="80%" r="46%">
      <stop offset="0%"   stop-color="#fb7cbd" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#fb7cbd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="20%" cy="76%" r="42%">
      <stop offset="0%"   stop-color="#00d1da" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#00d1da" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8f6ff"/>
    </linearGradient>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1a2a6b" flood-opacity=".35"/>
    </filter>
  </defs>

  <g>
    <circle cx="256" cy="256" r="224" fill="url(#body)"/>
    <circle cx="256" cy="256" r="224" fill="url(#cool)"/>
    <circle cx="256" cy="256" r="224" fill="url(#warm)"/>
    <circle cx="256" cy="256" r="224" fill="url(#spec)"/>
    <!-- Rim light: bright where the light lands, dark on the turn away. -->
    <circle cx="256" cy="256" r="222" fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="4"/>
    <circle cx="256" cy="256" r="224" fill="none" stroke="#2b3f96" stroke-opacity=".22" stroke-width="3"/>
  </g>

  <!-- The cross floats above the sphere rather than being painted on it, so it
       survives the shrink to a 32px favicon. -->
  <g filter="url(#lift)" fill="url(#cross)">
    <rect x="228" y="166" width="56" height="180" rx="22"/>
    <rect x="166" y="228" width="180" height="56" rx="22"/>
  </g>
</svg>
