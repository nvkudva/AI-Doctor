# Minimum config the Supabase CLI needs. The backend itself lives in src/backend;
# `migrations/`, `functions/` and `tests/` here are symlinks into it, and the seed
# is pointed at by path below. Nothing but this file and those three links belongs
# in this directory.

project_id = "virtual-doctor"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["../src/backend/seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.ai-consult]
verify_jwt = true

[functions.ai-review]
verify_jwt = true

[functions.voice-token]
verify_jwt = true
